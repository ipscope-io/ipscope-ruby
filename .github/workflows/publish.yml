name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Gem to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run Test Suite & Build Gem
        run: |
          ruby -Ilib test/test_ipscope.rb
          gem build ipscope.gemspec

      - name: Configure RubyGems OIDC Credentials (Trusted Publishing)
        if: env.HAS_SECRET_KEY == ''
        env:
          HAS_SECRET_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        uses: rubygems/configure-rubygems-credentials@v1
        continue-on-error: true

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -n "$GEM_HOST_API_KEY" ] || [ -f "$HOME/.gem/credentials" ]; then
            gem push ipscope-*.gem
          fi
