name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Gem to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run Test Suite & Build Gem
        run: |
          ruby -Ilib test/test_ipscope.rb
          gem build ipscope.gemspec

      - name: Configure RubyGems OIDC Credentials (Trusted Publishing)
        if: env.SECRET_KEY == ''
        env:
          SECRET_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        env:
          SECRET_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -n "$SECRET_KEY" ]; then
            GEM_HOST_API_KEY="$SECRET_KEY" gem push ipscope-*.gem
          else
            gem push ipscope-*.gem
          fi
