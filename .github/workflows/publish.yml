name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Gem to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run Test Suite & Build Gem
        run: |
          ruby -Ilib test/test_ipscope.rb
          gem build ipscope.gemspec

      - name: Publish to RubyGems (when RUBYGEMS_API_KEY is set)
        if: env.GEM_HOST_API_KEY != ''
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push ipscope-*.gem
